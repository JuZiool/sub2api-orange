[workspace]
resolver = "2"
members = ["crates/sub2api-auth", "crates/sub2api-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 异步运行时与 HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.7"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"

# 数据库（PostgreSQL）
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
] }

# 迁移运行器需要（对齐 Go 版 SHA256 checksum）
sha2 = "0.10"

# 请求 ID 生成（对齐 Go 版 google/uuid）
uuid = { version = "1", features = ["v4"] }

# 中间件需要 FutureExt::catch_unwind 做 panic 恢复
futures = "0.3"

# CSP nonce 生成（对齐 Go 版 crypto/rand + base64.StdEncoding）
getrandom = "0.2"
base64 = "0.22"

# JWT 签发与校验（对齐 Go 版 golang-jwt/jwt v5）
jsonwebtoken = "9"

# 时间类型（对齐 Go 版 time.Time 的 RFC3339 序列化）
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

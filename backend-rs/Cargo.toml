[workspace]
resolver = "2"
members = ["crates/sub2api-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 异步运行时与 HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.7"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"

# 数据库（PostgreSQL）
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
] }

# 迁移运行器需要（对齐 Go 版 SHA256 checksum）
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
